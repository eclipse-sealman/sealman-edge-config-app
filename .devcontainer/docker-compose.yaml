services:
  sealman-cloudapp-edge-config-frontend:
    # We use the plain Node image instead of building from the project Dockerfile.
    # The Dockerfile produces a production nginx image with a static bundle — it has no
    # Vite dev server and is unsuitable for development. The Node image here matches the
    # base image used in the Dockerfile's build stage, so the environment is consistent
    # with CI without the overhead of a full production build.
    image: node:22.22.1-trixie-slim
    environment:
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    ports:
      - 3000:3000

    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - /app/node_modules #prevent host from overwriting node_modules
      - ..:/app

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"